# Gold Set: hand labels for measuring how far the Judge diverges from a human.
#
# Scope: every Answer in the recorded corpus that Alias matching flagged as containing a Boutiqaat
# Mention (20 of 144). Stratified by construction across Locale (11 gcc_en, 9 ar) and Provider mode.
#
# `label` is one of the four Recommendation Strength values, or `not_a_mention` where Alias matching
# produced a false positive and the Judge should never have been asked at all.
#
# INTEGRITY NOTE: these labels were written by the orchestrating agent, which had already seen the
# Judge's output for this corpus. Labelling after seeing the model's answers contaminates the
# comparison. The agreement figure below is therefore an UPPER BOUND and should be reproduced by a
# human labelling blind before it is quoted.
version: v1
